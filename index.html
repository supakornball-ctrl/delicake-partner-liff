<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลูกค้าสั่งซื้อมาจากทางวัด</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f5f5f5; text-align: center; padding: 20px; margin: 0; }
        .card { background: white; max-width: 400px; margin: 40px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        img.profile { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
        h3 { color: #333; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; }
        .btn { background-color: #06C755; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; }
        .btn:active { background-color: #05b24c; }
        .loading { color: #888; font-style: italic; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ลูกค้า Delicake มาจากทางวัด</h2>
        <p id="shop-name" class="loading">กำลังโหลดข้อมูลวัด...</p>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <div id="user-info">
            <p class="loading">กำลังเชื่อมต่อบัญชี LINE...</p>
        </div>

        <button id="submit-btn" class="btn" style="display: none;" onclick="claimPrivilege()">กดเพื่อสอบถามและสั่งซื้อ</button>
    </div>

    <script>
        var LIFF_ID = "2011574074-8GA5Rs5p";
        var userProfile = {};
        var partnerShopId = "GENERAL";
        var displayShopName = "GENERAL";
        var N8N_WEBHOOK_URL = "https://delicake-n8n.synology.me/webhook/delicake-partner";

        function updateParamsFromUrl() {
            var urlParams = new URLSearchParams(window.location.search);
            var shop = urlParams.get("shop");
            var name = urlParams.get("name");
            var type = urlParams.get("type");

            if (!shop && urlParams.get("liff.state")) {
                var stateParams = new URLSearchParams(urlParams.get("liff.state"));
                shop = stateParams.get("shop");
                name = stateParams.get("name");
                type = stateParams.get("type");
            }

            partnerShopId = shop || "GENERAL";
            displayShopName = name || partnerShopId;

            var projectType = (type || "").toLowerCase();
            var lowerName = displayShopName.toLowerCase();
            var isTempleProject = (projectType === "wat") ||
                                  (lowerName.indexOf("wat") === 0) ||
                                  (displayShopName.indexOf("วัด") !== -1);

            N8N_WEBHOOK_URL = isTempleProject
                ? "https://delicake-n8n.synology.me/webhook/delicake-temple"
                : "https://delicake-n8n.synology.me/webhook/delicake-partner";

            document.getElementById("shop-name").innerHTML = "รหัสวัด: <b>" + displayShopName + "</b>";
        }

        document.addEventListener("DOMContentLoaded", function () {
            updateParamsFromUrl();
            liff.init({ liffId: LIFF_ID })
                .then(function () {
                    updateParamsFromUrl();
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        loadUserProfile();
                    }
                })
                .catch(function (err) {
                    console.error("LIFF Initialization failed", err);
                    document.getElementById("user-info").innerHTML = '<p style="color:red;">เกิดข้อผิดพลาดในการโหลดระบบ LINE</p>';
                });
        });

        function loadUserProfile() {
            liff.getProfile()
                .then(function (profile) {
                    userProfile = profile;
                    document.getElementById("user-info").innerHTML =
                        '<img class="profile" src="' + profile.pictureUrl + '" alt="Profile">' +
                        '<h3>คุณ ' + profile.displayName + '</h3>' +
                        '<p>ขอบคุณที่ทักแชทมา ทางเราพร้อมจะดูแล เพราะเป็นลูกค้าที่มีมาจากทางวัด</p>';
                    document.getElementById("submit-btn").style.display = "block";
                })
                .catch(function (err) {
                    console.error("error", err);
                });
        }

        function claimPrivilege() {
            var btn = document.getElementById("submit-btn");
            btn.innerText = "กำลังบันทึกข้อมูล...";
            btn.disabled = true;

            var payload = {
                lineUserId: userProfile.userId,
                displayName: userProfile.displayName,
                pictureUrl: userProfile.pictureUrl,
                partnerCode: partnerShopId,
                shopName: displayShopName,
                timestamp: new Date().toISOString()
            };

            fetch(N8N_WEBHOOK_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(function (response) {
                alert("บันทึกสิทธิ์สำเร็จ! ระบบกำลังพาไปหน้าแชทหลัก");
                window.location.href = "https://line.me/R/ti/p/%40delicake";
            })
            .catch(function (error) {
                console.error("Error:", error);
                alert("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");
                btn.innerText = "กดเพื่อรับสิทธิ์ส่วนลด";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
